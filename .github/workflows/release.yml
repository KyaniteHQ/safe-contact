# Publishes to npm when a version tag is pushed: `npm version patch && git push --follow-tags`.
# Uses npm trusted publishing (no token): set it up once on npmjs.com under the
# package's Settings → Trusted publishing, with this repository and release.yml.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      # prepublishOnly runs `npm run check` (typecheck, build, unit tests, size).
      - run: npm publish --access public --provenance
